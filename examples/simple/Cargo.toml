[package]
name = "simple"
version = "0.1.147"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
llama-cpp-2 = { path = "../../llama-cpp-2", version = "0.1.69" }
hf-hub = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
encoding_rs = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
vulkan = ["llama-cpp-2/vulkan"]
dynamic-link = ["llama-cpp-2/dynamic-link"]
dynamic-backends = ["llama-cpp-2/dynamic-backends"]
dynamic-backends-no-variants = ["dynamic-backends", "llama-cpp-2/dynamic-backends-no-variants"]
prebuilt-dynamic-backends = ["dynamic-backends-no-variants", "llama-cpp-2/prebuilt-dynamic-backends"]

[lints]
workspace = true
